server:
  port: 8080

spring:
  application:
    name: smart-campus-recruitment
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://bharathteja9192_db_user:Kollebharath9192@ac-ch2d9fr-shard-00-00.glotopv.mongodb.net:27017,ac-ch2d9fr-shard-00-01.glotopv.mongodb.net:27017,ac-ch2d9fr-shard-00-02.glotopv.mongodb.net:27017/smart_campus_recruitment?ssl=true&replicaSet=atlas-a5c8wy-shard-0&authSource=admin&appName=smart-campus}
  security:
    filter:
      order: 10

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
        transport:
          protocol: smtp

app:
  jwt:
    secret: ${JWT_SECRET:ChangeThisSecretKeyForSmartCampusRecruitmentSchedulerMCAProject2026}
    expiration-ms: 86400000

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

  mail:
    # Emails are only actually sent when MAIL_USERNAME/MAIL_PASSWORD are set (e.g. a Gmail app password).
    # Without them, the app logs what *would* have been sent so nothing breaks in dev.
    enabled: ${MAIL_ENABLED:false}
    from: "${MAIL_FROM:Smart Campus Recruitment <no-reply@smartcampus.local>}"

  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:3000}

logging:
  level:
    com.smartcampus: INFO
    org.springframework.security: WARN